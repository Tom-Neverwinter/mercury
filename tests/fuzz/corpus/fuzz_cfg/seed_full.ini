[main]
ui_enabled = true
ui_port = 10000
ui_protocol = ws
input_device = "hw:1,0"
output_device = "hw:1,0"
capture_channel = left
sound_system = alsa
arq_tcp_base_port = 8300
broadcast_tcp_port = 8100
callsign = "N0CALL"
verbose = false

[ptt]
method = serial
device = "/dev/ttyUSB0"
line = rts
invert = none

[arq]
retry_stagger_ms = 500

[store]
enabled = true
path = "/var/lib/mercury/msgs.jsonl"
max_messages = 500

[hl2]
frequency_hz = 7074000
